source=~/.config/hypr/hyprlock/colors.conf

background {
    color = rgba(181818FF)
}

# ──────────────── Password ────────────────

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.1
    dots_spacing = 0.3
    outer_color = $entry_border_color
    inner_color = $entry_background_color
    font_color = $entry_color
    fade_on_empty = true

    position = 0, 20
    halign = center
    valign = bottom
}

# ──────────────── Clock ────────────────

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $text_color
    font_size = 64
    font_family = $font_family

    position = 0, 180
    halign = center
    valign = center
}

# ──────────────── Name ────────────────

label {
    monitor =
    text = cmd[update:0] u="$(whoami)"; printf '%s%s' "$(printf %s "$u" | cut -c1 | tr a-z A-Z)" "$(printf %s "$u" | cut -c2-)"  # your username, capitalized
    color = $text_color
    font_size = 22
    font_family = $font_family

    position = 0, 105
    halign = center
    valign = center
}

# ──────────────── Keyboard Layout ────────────────

label {
    monitor =
    text = $LAYOUT
    color = $text_color
    font_size = 14
    font_family = $font_family
    position = -30, 30
    halign = right
    valign = bottom
}

# ──────────────── Caps Lock Warning ────────────────

label {
    monitor =
    text = cmd[update:250] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/check-capslock.sh
    color = $text_color
    font_size = 13
    font_family = $font_family
    position = 0, -25
    halign = center
    valign = center
}
