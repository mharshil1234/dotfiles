# Don't print a new line at the start of the prompt
add_newline = false
# Pipes ╰─ ╭─
# Powerline symbols                                     
# Wedges 🭧🭒 🭣🭧🭓
# Random noise 🬖🬥🬔🬗
# Cool stuff 󰜥   

# format = """
# $directory $fill $git_branch $cmd_duration
#  $character"""
# Pills in wallpaper colors: kitty's colors 232-255 are generated from the wallpaper
#   254/233 primary container, 252/235 secondary container, 250/237 tertiary container,
#   248/239 error container, 255 primary, 249 error
format = """
$directory$git_branch$git_status$cmd_duration$status
$character"""

[fill]
symbol = '-'
style = 'fg:245'

# Replace the "❯" symbol in the prompt with "➜"
[character]
success_symbol = "[❯](bold fg:255)"
error_symbol = "[❯](bold fg:249)"

[package]
disabled = true

[git_branch]
symbol = "󰘬"
truncation_length = 20
truncation_symbol = "…"
format = " [](fg:252)[$symbol $branch](fg:235 bg:252)[](fg:252)"

[git_commit]
commit_hash_length = 4
tag_symbol = " "

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '
cherry_pick = "[🍒 PICKING](bold red)"

[git_status]
format = "( [](fg:250)[󰊢$all_status$ahead_behind](fg:237 bg:250)[](fg:250))"
conflicted = " =$count"
ahead = " ⇡$count"
behind = " ⇣$count"
diverged = " ⇕⇡$ahead_count⇣$behind_count"
untracked = " ?$count"
stashed = " ≡$count"
modified = " !$count"
staged = " +$count"
renamed = " »$count"
deleted = " ✘$count"

[hostname]
ssh_only = false
format =  "[•$hostname](bg:252 bold fg:235)[](bold fg:252)"
trim_at = ".companyname.com"
disabled = false

[line_break]
disabled = false

[memory_usage]
disabled = true
threshold = -1
symbol = " "
style = "bold dimmed green"

[time]
disabled = true
format = '🕙[\[ $time \]]($style) '
time_format = "%T"

[username]
style_user = "bold bg:252 fg:235"
style_root = "red bold"
format = "[](bold fg:252)[$user]($style)"
disabled = false
show_always = true

[directory]
home_symbol = "~"
read_only = " 󰌾"
style = "bold fg:233 bg:254"
read_only_style = "fg:233 bg:254"
truncation_length = 3
truncation_symbol = "…/"
format = '[](fg:254)[󰉋 $path]($style)[$read_only]($read_only_style)[](fg:254)'

[directory.substitutions]
"Desktop" = "  "
"Documents" = "  "
"Downloads" = "  "
"Music" = " 󰎈 "
"Pictures" = "  "
"Videos" = "  "
"GitHub" = " 󰊤 "

[cmd_duration]
min_time = 2000 # only for commands that took 2 s or more
format = ' [](fg:252)[󰔟 $duration](fg:235 bg:252)[](fg:252)'

[status]
disabled = false
format = ' [](fg:248)[✘ $status](bold fg:239 bg:248)[](fg:248)'
